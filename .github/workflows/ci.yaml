name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.18.3"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: |
          npx tsc --noEmit -p packages/ledger/tsconfig.json
          npx tsc --noEmit -p packages/hardhat/tsconfig.json

      - name: Ledger unit tests (money, state machine, webhooks)
        run: npm run test --workspace @hmp/ledger

      - name: Compile contracts
        run: npm run compile --workspace @hmp/hardhat

      - name: Contract tests
        run: npm run test --workspace @hmp/hardhat
