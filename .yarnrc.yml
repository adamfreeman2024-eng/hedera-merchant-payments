enableColors: true

# Matches the hedera-dev/scaffold-hbar template conventions so the harness and the
# CLI see a familiar project shape: node_modules linker (not PnP), which keeps
# Next.js, Hardhat and Prisma working out of the box.
nmHoistingLimits: workspaces

nodeLinker: node-modules

# Vendored Yarn 3.2.3 launcher: the template works even where Corepack is off and
# without network access to a package manager.
yarnPath: .yarn/releases/yarn-3.2.3.cjs
